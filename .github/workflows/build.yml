name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "22"

jobs:
  version:
    name: Resolve Build Version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      canary: ${{ steps.version.outputs.canary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Resolve canary version for pushes to main
        run: |
          SOURCE="$(tr -d '[:space:]' < internal/version/VERSION)"
          # 上一版基线拿不到时留空，按「没改过」处理。
          PREVIOUS="$(git show "${GITHUB_SHA}^:internal/version/VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          VALUE="$SOURCE"
          CANARY=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if [[ -n "$PREVIOUS" && "$PREVIOUS" != "$SOURCE" ]]; then
              # 这次合并改了版本基线，是在准备发正式版。此时再发 Canary，它的版本号会比
              # 紧接着发的正式版还高，Canary 用户之后会以为正式版是退版，所以跳过。
              echo "internal/version/VERSION 改成了 $SOURCE，按发布准备处理，跳过 Canary"
            else
              # 每次合并到 main 发一个 Canary：最新正式版的下一个修订号，序号接着已有的 Canary 往上加。
              STABLE="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
              if [[ -z "$STABLE" ]]; then
                echo "没有正式版标签，推算不出 Canary 版本号" >&2
                exit 1
              fi
              IFS=. read -r MAJOR MINOR PATCH <<<"${STABLE#v}"
              CORE="${MAJOR}.${MINOR}.$((PATCH + 1))"
              LAST="$(git tag -l "v${CORE}-canary.*" | sed "s/^v${CORE}-canary\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)"
              VALUE="${CORE}-canary.$(( ${LAST:-0} + 1 ))"
              CANARY=true
            fi
          fi
          echo "构建版本 $VALUE（canary=$CANARY）"
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "canary=$CANARY" >> "$GITHUB_OUTPUT"

  audit:
    name: Public Repo & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files and license consistency
        run: bash scripts/check-public-repo.sh

  build:
    name: Build, Test & Package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canary version
        if: needs.version.outputs.canary == 'true'
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.version.outputs.value }}
        run: printf '%s\n' "$BUILD_VERSION" > internal/version/VERSION
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(tr -d '[:space:]' < internal/version/VERSION)
          test "$TAG" = "v$version"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          test -s "docs/releases/$version.md"
          if grep -q 'YOUR_ACCOUNT' "docs/releases/$version.md"; then
            echo 'Replace repository placeholders in release notes before publishing'; exit 1
          fi
      - name: Frontend typecheck and build
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci && npm run typecheck && npm run build
      - name: Go tests and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Installer and commit hook checks
        run: |
          sh -n scripts/install.sh
          python3 scripts/test_install.py
          python3 scripts/test_commit_message.py
      - name: Package cross-platform release archives
        run: python3 scripts/package.py
      - name: Verify Linux installation
        run: |
          sh scripts/install.sh --local-dir release --dir "$RUNNER_TEMP/anime-bin"
          test "$("$RUNNER_TEMP/anime-bin/bgmcat" --version)" = "$(tr -d '[:space:]' < internal/version/VERSION)"
      - name: Verify Docker image build
        run: |
          docker build -t bgmcat:test .
          docker run --rm bgmcat:test --version
      - name: Upload full release packages
        if: startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.canary == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          retention-days: 3
          if-no-files-found: error
          path: release/

  windows-install:
    name: Windows Engine & Installer Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build Windows release archive locally
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci && npm run build
          python3 scripts/package.py --target windows/amd64
      - name: Test native HTTP and BitTorrent engine on Windows
        shell: powershell
        env:
          TORRENT_STORAGE_DEFAULT_FILE_IO: classic
        run: |
          go test ./internal/app -run 'TestNative|TestNativeTorrentLocalPeer' -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Native engine tests failed' }
      - name: Verify Windows installation and upgrade
        shell: powershell
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'anime-bin'
          ./scripts/install.ps1 -LocalDir release -InstallDir $dest
          ./scripts/install.ps1 -LocalDir release -InstallDir $dest
          $actual = & (Join-Path $dest 'bgmcat.exe') --version
          if ($actual -ne (Get-Content internal/version/VERSION).Trim()) { throw 'Version mismatch' }
          if (-not (Test-Path (Join-Path $dest 'bgmcat.exe.previous'))) { throw 'Upgrade backup missing' }

  desktop:
    name: Desktop ${{ matrix.platform }}-${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: mac, arch: arm64}
          - {os: macos-15-intel, platform: mac, arch: x64}
          - {os: windows-latest, platform: win, arch: x64}
          - {os: ubuntu-24.04, platform: linux, arch: x64}
    steps:
      - uses: actions/checkout@v4
      - name: Apply canary version
        if: needs.version.outputs.canary == 'true'
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.version.outputs.value }}
        run: printf '%s\n' "$BUILD_VERSION" > internal/version/VERSION
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: npm ci
      - run: npm run desktop:prepare
      - run: npm run desktop:test
      - run: npx electron-builder --config desktop/builder.cjs --publish never --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: node scripts/package-desktop-dmg.cjs
      - name: Upload desktop installer artifacts
        if: startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.canary == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 3
          if-no-files-found: error
          path: |
            desktop-dist/*.dmg
            desktop-dist/*.zip
            desktop-dist/*.exe
            desktop-dist/*.AppImage
            desktop-dist/*.deb

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canary version
        if: needs.version.outputs.canary == 'true'
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.version.outputs.value }}
        run: printf '%s\n' "$BUILD_VERSION" > internal/version/VERSION
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build bundled Go backend for Android
        # The runner image ships the NDK (ANDROID_NDK_LATEST_HOME); the backend embeds web/dist.
        run: |
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci && npm run build
          bash scripts/build-android-backend.sh
      - name: Prepare optional release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bgmcat-release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/bgmcat-release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..
          version=$(tr -d '[:space:]' < internal/version/VERSION)
          mkdir -p android-dist
          cp android/app/build/outputs/apk/release/app-release.apk "android-dist/bgmcat-android-${version}-universal.apk"
      - name: Upload Android APK artifact
        if: startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.canary == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          retention-days: 3
          if-no-files-found: error
          path: android-dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.canary == 'true'
    needs: [version, audit, build, windows-install, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release
      - name: Add desktop and Android checksums
        run: |
          cd release
          sha256sum bgmcat-desktop-* bgmcat-android-* >> SHA256SUMS
      - name: Write canary release notes
        if: needs.version.outputs.canary == 'true'
        run: |
          # 列出上一个版本（Canary 或正式版）以来合进 main 的改动。
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          {
            echo "这是从 main 自动构建的 Canary 测试版（提交 ${GITHUB_SHA:0:7}），没有经过正式发布前的检查，可能不稳定。"
            echo
            echo "想长期使用请装稳定版。应用内「设置 → 版本」把更新通道切到 Canary，才会提示这类版本。"
            echo
            if [[ -n "$previous" ]]; then
              echo "## 自 ${previous} 以来的改动"
              echo
              git log --no-merges --format='- %s' "${previous}..HEAD"
            fi
          } > "$RUNNER_TEMP/canary-notes.md"
          cat "$RUNNER_TEMP/canary-notes.md"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANARY: ${{ needs.version.outputs.canary }}
          BUILD_VERSION: ${{ needs.version.outputs.value }}
          TAG: ${{ github.ref_name }}
        run: |
          # 每个版本的说明末尾都附上「下载哪个文件」，发布页上的文件太多时一眼能找到自己要的。
          notes="$RUNNER_TEMP/release-notes.md"
          if [[ "$CANARY" == true ]]; then
            version="$BUILD_VERSION"
            cp "$RUNNER_TEMP/canary-notes.md" "$notes"
          else
            version="${TAG#v}"
            cp "docs/releases/${version}.md" "$notes"
          fi
          sed "s/{VERSION}/${version}/g" docs/release-download-guide.md >> "$notes"
          if [[ "$CANARY" == true ]]; then
            # Canary 的标签由这里在当前提交上创建；GITHUB_TOKEN 建的标签不会再触发一轮 CI。
            gh release create "v$BUILD_VERSION" release/* --target "$GITHUB_SHA" --title "Bangumi Cat v$BUILD_VERSION" \
              --notes-file "$notes" --prerelease --latest=false
            exit 0
          fi
          flags=(--latest)
          if [[ "$TAG" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" release/* --verify-tag --title "Bangumi Cat $TAG" --notes-file "$notes" "${flags[@]}"
      - name: Prune superseded canary releases
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # 应用内检查更新只看最近 30 条 Release，Canary 堆多了会把正式版挤出去。
          # 发正式版时删掉版本号不高于它的 Canary；手动发的 beta/rc 保留。
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9]+$' || true; } |
            while read -r tag; do
              if [[ "$(printf '%s\n%s\n' "${tag%%-*}" "$TAG" | sort -V | tail -n 1)" == "$TAG" ]]; then
                gh release delete "$tag" --cleanup-tag --yes || echo "::warning::删除 $tag 失败"
              fi
            done

  container:
    if: (startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.canary == 'true') && vars.PUBLISH_CONTAINER == 'true'
    needs: [version, audit, build, windows-install]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply canary version
        if: needs.version.outputs.canary == 'true'
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.version.outputs.value }}
        run: printf '%s\n' "$BUILD_VERSION" > internal/version/VERSION
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          CANARY: ${{ needs.version.outputs.canary }}
          BUILD_VERSION: ${{ needs.version.outputs.value }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          channel=latest
          if [[ "$TAG" == *-* ]]; then channel=beta; fi
          if [[ "$CANARY" == true ]]; then TAG="v$BUILD_VERSION"; channel=canary; fi
          echo "tags=$image:$TAG,$image:$channel" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
