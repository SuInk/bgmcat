name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "22"

jobs:
  audit:
    name: Public Repo & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files and license consistency
        run: bash scripts/check-public-repo.sh

  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(tr -d '[:space:]' < internal/version/VERSION)
          test "$TAG" = "v$version"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          test -s "docs/releases/$version.md"
          if grep -q 'YOUR_ACCOUNT' "docs/releases/$version.md"; then
            echo 'Replace repository placeholders in release notes before publishing'; exit 1
          fi
      - name: Frontend typecheck and build
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci && npm run typecheck && npm run build
      - name: Go tests and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Installer and commit hook checks
        run: |
          sh -n scripts/install.sh
          python3 scripts/test_install.py
          python3 scripts/test_commit_message.py
      - name: Package cross-platform release archives
        run: python3 scripts/package.py
      - name: Verify Linux installation
        run: |
          sh scripts/install.sh --local-dir release --dir "$RUNNER_TEMP/anime-bin"
          test "$("$RUNNER_TEMP/anime-bin/bgmcat" --version)" = "$(tr -d '[:space:]' < internal/version/VERSION)"
      - name: Verify Docker image build
        run: |
          docker build -t bgmcat:test .
          docker run --rm bgmcat:test --version
      - name: Upload full release packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          retention-days: 3
          if-no-files-found: error
          path: release/

  windows-install:
    name: Windows Engine & Installer Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build Windows release archive locally
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci && npm run build
          python3 scripts/package.py --target windows/amd64
      - name: Test native HTTP and BitTorrent engine on Windows
        shell: powershell
        env:
          TORRENT_STORAGE_DEFAULT_FILE_IO: classic
        run: |
          go test ./internal/app -run 'TestNative|TestNativeTorrentLocalPeer' -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Native engine tests failed' }
      - name: Verify Windows installation and upgrade
        shell: powershell
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'anime-bin'
          ./scripts/install.ps1 -LocalDir release -InstallDir $dest
          ./scripts/install.ps1 -LocalDir release -InstallDir $dest
          $actual = & (Join-Path $dest 'bgmcat.exe') --version
          if ($actual -ne (Get-Content internal/version/VERSION).Trim()) { throw 'Version mismatch' }
          if (-not (Test-Path (Join-Path $dest 'bgmcat.exe.previous'))) { throw 'Upgrade backup missing' }

  desktop:
    name: Desktop ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: mac, arch: arm64}
          - {os: macos-15-intel, platform: mac, arch: x64}
          - {os: windows-latest, platform: win, arch: x64}
          - {os: ubuntu-24.04, platform: linux, arch: x64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: npm ci
      - run: npm run desktop:prepare
      - run: npm run desktop:test
      - run: npx electron-builder --config desktop/builder.cjs --publish never --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: node scripts/package-desktop-dmg.cjs
      - name: Upload desktop installer artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 3
          if-no-files-found: error
          path: |
            desktop-dist/*.dmg
            desktop-dist/*.zip
            desktop-dist/*.exe
            desktop-dist/*.AppImage
            desktop-dist/*.deb

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Prepare optional release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bgmcat-release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/bgmcat-release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..
          version=$(tr -d '[:space:]' < internal/version/VERSION)
          mkdir -p android-dist
          cp android/app/build/outputs/apk/release/app-release.apk "android-dist/bgmcat-android-${version}-universal.apk"
      - name: Upload Android APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          retention-days: 3
          if-no-files-found: error
          path: android-dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [audit, build, windows-install, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release
      - name: Add desktop and Android checksums
        run: |
          cd release
          sha256sum bgmcat-desktop-* bgmcat-android-* >> SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--latest)
          if [[ "$TAG" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" release/* --verify-tag --title "Bangumi Cat $TAG" --notes-file "docs/releases/${TAG#v}.md" "${flags[@]}"

  container:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_CONTAINER == 'true'
    needs: [audit, build, windows-install]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          channel=latest
          if [[ "$TAG" == *-* ]]; then channel=beta; fi
          echo "tags=$image:$TAG,$image:$channel" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
