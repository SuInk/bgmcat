<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <!-- 只装 manifest，不注册 Service Worker：会缓存 API 响应，和 token/隧道纠缠不清，收益不抵麻烦。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 取值来自 style.css 的 --app-bg（浅色 / 深色） -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16131a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 主屏幕图标下面只放得下五六个字，长了会被截成「猫追番 · B…」 -->
    <meta name="apple-mobile-web-app-title" content="猫追番" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>猫追番 · Bangumi Cat</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f7f4f5; color: #251d23; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      @media (prefers-color-scheme: dark) { html, body { background: #16131a; color: #f1eaef; } }
      .startup-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 100dvh; font-size: 13px; opacity: 0.78; }
      .startup-spinner { width: 24px; height: 24px; border: 2.5px solid rgba(128, 128, 128, 0.22); border-top-color: #4b83ff; border-radius: 999px; animation: startup-spin 0.8s linear infinite; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="startup-loading" role="status" aria-live="polite">
        <span class="startup-spinner" aria-hidden="true"></span>
        <span>正在启动 Bangumi Cat…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
