<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <!-- 只装 manifest，不注册 Service Worker：会缓存 API 响应，和 token/隧道纠缠不清，收益不抵麻烦。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 取值来自 style.css 的 --app-bg（浅色 / 深色） -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16131a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 主屏幕图标下面只放得下五六个字，长了会被截成「猫追番 · B…」 -->
    <meta name="apple-mobile-web-app-title" content="猫追番" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>猫追番 · Bangumi Cat</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
